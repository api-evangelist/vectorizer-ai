name: Vectorizer.AI
description: >-
  Vectorizer.AI converts raster bitmap images into vector artwork through a production HTTP API,
  returning SVG, PDF, EPS, DXF and PNG. The API is small and single-purpose: four operations covering
  vectorization, download of a previously vectorized result, deletion, and an account endpoint for
  checking subscription and credit state. Authentication is HTTP Basic, using an API Id as the
  username and an API Secret as the password. The company publishes its own APIs.json discovery
  document at vectorizer.ai/apis.json and a first-party OpenAPI 3.0.3 description at
  vectorizer.ai/api/openapi.json, alongside official SDKs, a cross-platform CLI, a public Postman
  workspace, and separately documented error codes and rate limits. The service is operated by Cedar
  Lake Ventures, Inc.
